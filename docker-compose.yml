# Local environment: the API plus its own PostgreSQL, isolated from Supabase.
#
#   docker compose up -d db                          start the database
#   docker compose run --rm api --migrate --seed     create schema + demo catalog
#   docker compose up -d api                         start the API
#   -> http://localhost:8080/scalar
#
#   docker compose logs -f api                       follow the API logs
#   docker compose down                              stop everything (data is kept)
#   docker compose down -v                           stop and DELETE the database volume
#
# The credentials below are for this throwaway local database only.

services:
  db:
    image: postgres:17-alpine   # same major version as Supabase
    environment:
      POSTGRES_USER: veritas
      POSTGRES_PASSWORD: veritas
      POSTGRES_DB: veritas
    ports:
      - "5433:5432"             # 5433 on the host, so it never clashes with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritas -d veritas"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: veritas-api:local
    pull_policy: build   # always build locally; never try to pull "veritas-api" from Docker Hub
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres accepts connections
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # enables Scalar at /scalar
      # Gss Encryption Mode=Disable: the ASP.NET image has no Kerberos library,
      # so Npgsql would otherwise log "Cannot load library libgssapi_krb5.so.2".
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=veritas;Username=veritas;Password=veritas;Gss Encryption Mode=Disable"
      Jwt__SigningKey: "local-docker-only-signing-key-not-for-production-48b"
    ports:
      - "8080:8080"

volumes:
  pgdata:
