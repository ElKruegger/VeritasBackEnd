# Continuous deployment for the Véritas backend.
#
# Runs only after the CI workflow has finished GREEN on a push to main
# (i.e. after developer is merged into main). Three jobs, in order:
#
#   1. build    builds the Docker image once and pushes it to GHCR,
#               tagged with the commit SHA.
#   2. migrate  runs THAT SAME image with --migrate against Supabase.
#   3. deploy   tells Render to deploy THAT SAME image.
#
# The schema and the code that goes live always come from one build, and
# a failed migration (non-zero exit code) stops the pipeline before the
# deploy.
#
# Required setup (see README > Continuous deployment):
#   GitHub environment "production" with the secrets
#     SUPABASE_CONNECTION_STRING   Npgsql connection string (session pooler)
#     RENDER_DEPLOY_HOOK_URL       Render service > Settings > Deploy Hook

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # manual re-deploy of the current main

permissions:
  contents: read

# Never run two deploys at the same time, and never cancel one halfway
# through: an interrupted migration is worse than a queued deploy.
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  build:
    name: Build & push image
    # workflow_run fires for failed CI runs too; only continue on success
    # of a push (a PR into main never deploys).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in GITHUB_TOKEN
    outputs:
      image: ${{ steps.ref.outputs.image }}

    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Image names on GHCR must be lowercase; the owner (ElKruegger) isn't.
      - name: Compute image reference
        id: ref
        run: |
          sha="$(git rev-parse HEAD)"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/veritas-api:sha-${sha}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${owner}/veritas-api:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ steps.ref.outputs.latest }}
          # Links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          # Reuses Docker layers (e.g. the NuGet restore) between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Apply database migrations
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      # Fails in seconds with a readable message instead of pulling the
      # whole image to find out. A secret that doesn't exist arrives as an
      # empty string, and Npgsql doesn't accept the postgresql:// URI that
      # Supabase shows by default — it needs Host=...;Port=...; pairs.
      - name: Check the connection string secret
        env:
          CONNECTION_STRING: ${{ secrets.SUPABASE_CONNECTION_STRING }}
        run: |
          if [ -z "$CONNECTION_STRING" ]; then
            echo "::error title=Missing secret::SUPABASE_CONNECTION_STRING is not set in the 'production' environment."
            exit 1
          fi
          case "$CONNECTION_STRING" in
            postgres://*|postgresql://*)
              echo "::error title=Wrong format::SUPABASE_CONNECTION_STRING is a URI. Use the Npgsql format: Host=...;Port=5432;Database=postgres;Username=...;Password=...;SSL Mode=Require (see README)."
              exit 1
              ;;
          esac

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # "-e NAME" without "=value" copies the variable from the step's env,
      # so the connection string never appears on the command line.
      - name: Run the image with --migrate
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: ${{ secrets.SUPABASE_CONNECTION_STRING }}
        run: |
          docker run --rm \
            -e ASPNETCORE_ENVIRONMENT \
            -e ConnectionStrings__DefaultConnection \
            "$IMAGE" --migrate

  deploy:
    name: Deploy to Render
    needs: [build, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      # Render's deploy hook accepts imgURL for image-backed services: it
      # deploys exactly the image that was just migrated, not "latest".
      - name: Trigger the Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          # First-time setup: the Render service can only be created once
          # the image exists on GHCR, so the hook doesn't exist yet on the
          # very first run. Skip with a warning instead of failing.
          if [ -z "$HOOK" ]; then
            echo "::warning title=Deploy skipped::RENDER_DEPLOY_HOOK_URL is not set. Image $IMAGE is built and migrated but not deployed."
            exit 0
          fi
          encoded="$(jq -rn --arg v "$IMAGE" '$v|@uri')"
          curl --fail-with-body --silent --show-error -X POST "${HOOK}&imgURL=${encoded}"
          echo
          echo "Render deploy triggered for $IMAGE"
